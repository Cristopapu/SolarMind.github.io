<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLAR MIND - Carrito de Compras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://png.pngtree.com/thumb_back/fh260/background/20240327/pngtree-supermarket-aisle-with-empty-shopping-cart-at-grocery-store-retail-business-image_15646095.jpg') center/cover no-repeat fixed; /* PON AQUÍ TU IMAGEN */
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(90deg, #FFA500, #FF8C00);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            background: white;
            color: #FFA500;
        }

        /* Header */
        .cart-header {
            text-align: center;
            padding: 3rem 2rem;
            color: black;
        }

        .cart-header h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        /* Main Container */
        .cart-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        /* Cart Items */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .cart-item {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            gap: 1.5rem;
            transition: 0.3s;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .item-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            background: linear-gradient(135deg, #FFA500, #FF8C00);
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .item-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .item-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #f5f5f5;
            padding: 0.5rem 1rem;
            border-radius: 50px;
        }

        .quantity-btn {
            background: white;
            border: 2px solid #FFA500;
            color: #FFA500;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background: #FFA500;
            color: white;
            transform: scale(1.1);
        }

        .quantity {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .item-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FF0000;
        }

        .item-unit-price {
            font-size: 0.8rem;
            color: #666;
        }

        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .remove-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* Summary */
        .cart-summary {
            position: sticky;
            top: 100px;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .summary-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: #666;
            font-size: 1rem;
        }

        .summary-row.total {
            border-top: 2px solid #eee;
            padding-top: 1rem;
            margin-top: 1rem;
            font-size: 1.5rem;
            color: #333;
            font-weight: bold;
        }

        .summary-row.total .price {
            color: #FF0000;
            font-size: 1.8rem;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(90deg, #FFA500, #FF8C00);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1.5rem;
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4);
        }

        .checkout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.6);
        }

        .benefits {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid #eee;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            color: #666;
            font-size: 0.9rem;
        }

        /* Payment methods styles (usadas por el JS) */
        .payment-section {
            margin-top: 1rem;
        }

        .payment-section h4 {
            margin-bottom: 0.8rem;
            color: #333;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 2px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .payment-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .payment-option.selected {
            border-color: #FFA500;
            box-shadow: 0 10px 30px rgba(255,165,0,0.15);
            background: linear-gradient(90deg, rgba(255,165,0,0.06), rgba(255,140,0,0.03));
        }

        .payment-icon {
            font-size: 1.6rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: white;
            border: 1px solid #eee;
        }

        .payment-label {
            font-weight: 600;
            color: #333;
        }

        .payment-desc {
            font-size: 0.9rem;
            color: #666;
        }

        /* Empty Cart */
        .empty-cart {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .empty-cart-icon {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
        }

        .empty-cart h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 1rem;
        }

        .empty-cart p {
            color: #666;
            margin-bottom: 2rem;
        }

        .shop-button {
            background: linear-gradient(90deg, #FFA500, #FF8C00);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .shop-button:hover {
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            background: linear-gradient(90deg, #FFA500, #FF8C00);
            color: white;
            padding: 3rem 2rem;
            margin-top: 3rem;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .footer-section h3 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .footer-section p {
            margin-bottom: 0.5rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            font-size: 2rem;
        }

        .social-links a {
            color: white;
            transition: 0.3s;
        }

        .social-links a:hover {
            transform: translateY(-5px);
        }

        .footer-bottom {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: relative;
                top: 0;
            }

            .cart-item {
                flex-direction: column;
            }

            .item-image {
                width: 100%;
                height: 200px;
            }

            .cart-header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

            {

                price: 420,

            },
            {

                name: "Bomba de Agua Solar",
                description: "Bomba solar para fuentes o riego de jardín. Ecológica y eficiente.",
                price: 590,
                image: "bomba solar.jpeg"
            },
            {
                id: 13,
                name: "Mochila Solar con USB",
                description: "Mochila con panel solar integrado para cargar dispositivos mientras caminas.",
                price: 750,
                image: "mochila solar.jpg"
            },
            {
                id: 14,
                name: "Calentador Solar Portátil",
                description: "Calentador solar compacto para agua. Perfecto para duchas al aire libre.",
                price: 1200,
                image: "calentador solar.png"
            },
            {
                id: 15,
                name: "Lámpara Solar de Mesa",
                description: "Lámpara decorativa con carga solar. Moderna y funcional.",
                price: 340,
                image: "lampara de mesa.jpeg"
            }
        ];

        // =====================================================
        // MÉTODOS DE PAGO — pon la URL de tu imagen en "img"
        // Si dejas img vacío ('') se mostrará el emoji de "icon"
        // =====================================================
        const paymentOptions = [
            {
                id: 'card',
                label: 'Tarjeta de Crédito / Débito',
                desc: 'Visa, MasterCard, Amex',
                icon: '💳',
                img: 'Pagos1.png'   // ← pon aquí la URL de tu imagen, ej: 'visa.png' o 'https://...'
            },
            {
                id: 'paypal',
                label: 'PayPal',
                desc: 'Pago seguro con PayPal',
                icon: '🅿️',
                img: 'Pagos3.png'   // ← pon aquí la URL de tu imagen de PayPal
            },
            {
                id: 'oxxo',
                label: 'OXXO / Pago en Efectivo',
                desc: 'Paga en efectivo en OXXO',
                icon: '🏪',
                img: 'Pagos4.png'   // ← pon aquí la URL de tu imagen de OXXO
            },
            {
                id: 'transfer',
                label: 'Transferencia Bancaria',
                desc: 'Depósito o SPEI',
                icon: '🏦',
                img: 'Pagos2.png'   // ← pon aquí la URL de tu imagen de transferencia/SPEI
            }
        ];

        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const container = document.getElementById('cartContainer');
            const itemCount = document.getElementById('cartItemCount');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon"><img src="Carrito.png" alt="Carrito vacío" style="width:5rem;height:5rem;object-fit:contain;"></div>
                        <h2>Tu carrito está vacío</h2>
                        <p>¡Agrega productos solares y comienza a ahorrar energía!</p>
                        <a href="catalogo.html" class="shop-button">Ver Catálogo</a>
                    </div>
                `;
                itemCount.textContent = '0 productos en tu carrito';
                return;
            }

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            itemCount.textContent = `${totalItems} producto${totalItems !== 1 ? 's' : ''} en tu carrito`;

            const cartItemsHTML = cart.map(item => {
                const product = products.find(p => p.id === item.productId);
                if (!product) return '';

                return `
                    <div class="cart-item">
                        <img src="${product.image}" alt="${product.name}" class="item-image">
                        <div class="item-details">
                            <div>
                                <div class="item-name">${product.name}</div>
                                <div class="item-description">${product.description}</div>
                            </div>
                            <div class="item-controls">
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="updateQuantity(${product.id}, -1)">-</button>
                                    <span class="quantity">${item.quantity}</span>
                                    <button class="quantity-btn" onclick="updateQuantity(${product.id}, 1)">+</button>
                                </div>
                                <div>
                                    <div class="item-price">$${(product.price * item.quantity).toFixed(2)}</div>
                                    <div class="item-unit-price">$${product.price.toFixed(2)} c/u</div>
                                </div>
                                <button class="remove-btn" onclick="removeItem(${product.id})">Eliminar</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const subtotal = cart.reduce((sum, item) => {
                const product = products.find(p => p.id === item.productId);
                return sum + (product.price * item.quantity);
            }, 0);

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            container.innerHTML = `
                <div class="cart-items">
                    ${cartItemsHTML}
                </div>
                <div class="cart-summary">
                    <div class="summary-title">Resumen de Compra</div>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span>$${subtotal.toFixed(2)} MXN</span>
                    </div>
                    <div class="summary-row">
                        <span>IVA (16%):</span>
                        <span>$${iva.toFixed(2)} MXN</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span class="price">$${total.toFixed(2)} MXN</span>
                    </div>

                    <!-- Payment methods will be rendered here -->
                    <div class="payment-section" id="paymentSection">
                        <h4>Método de Pago</h4>
                        <div id="paymentMethods" class="payment-methods" aria-label="Métodos de pago"></div>
                    </div>

                    <button class="checkout-btn" onclick="checkout()">
                        Proceder al Pago
                    </button>
                    <div class="benefits">
                        <div class="benefit-item">Pago 100% Seguro</div>
                        <div class="benefit-item">Envío Gratis en pedidos +$1000</div>
                        <div class="benefit-item">Productos Eco-Friendly</div>
                        <div class="benefit-item">Garantía de 1 año</div>
                    </div>
                </div>
            `;

            // Después de renderizar el HTML del resumen, renderizamos las opciones de pago
            renderPaymentOptions();
        }

        function renderPaymentOptions() {
            const container = document.getElementById('paymentMethods');
            if (!container) return;

            const selected = localStorage.getItem('selectedPaymentMethod') || null;

            container.innerHTML = ''; // limpiar

            paymentOptions.forEach(opt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'payment-option' + (selected === opt.id ? ' selected' : '');
                optionDiv.setAttribute('role', 'button');
                optionDiv.setAttribute('tabindex', '0');
                optionDiv.setAttribute('data-id', opt.id);
                optionDiv.setAttribute('aria-pressed', selected === opt.id ? 'true' : 'false');

                const iconContent = opt.img
                    ? `<img src="${opt.img}" alt="${opt.label}" style="width:36px;height:36px;object-fit:contain;border-radius:6px;">`
                    : opt.icon;

                optionDiv.innerHTML = `
                    <div class="payment-icon" aria-hidden="true">${iconContent}</div>
                    <div style="display:flex;flex-direction:column;">
                        <div class="payment-label">${opt.label}</div>
                        <div class="payment-desc">${opt.desc}</div>
                    </div>
                `;

                // click handler
                optionDiv.addEventListener('click', () => selectPaymentMethod(opt.id));
                // keyboard handler (Enter / Space)
                optionDiv.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectPaymentMethod(opt.id);
                    }
                });

                container.appendChild(optionDiv);
            });
        }

        function selectPaymentMethod(methodId) {
            localStorage.setItem('selectedPaymentMethod', methodId);
            // actualizar UI: quitar selected de todos y añadir al elegido
            const nodes = document.querySelectorAll('.payment-option');
            nodes.forEach(n => {
                if (n.getAttribute('data-id') === methodId) {
                    n.classList.add('selected');
                    n.setAttribute('aria-pressed', 'true');
                } else {
                    n.classList.remove('selected');
                    n.setAttribute('aria-pressed', 'false');
                }
            });
        }

        function updateQuantity(productId, change) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const itemIndex = cart.findIndex(item => item.productId === productId);
            
            if (itemIndex !== -1) {
                cart[itemIndex].quantity = Math.max(1, cart[itemIndex].quantity + change);
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
            }
        }

        function removeItem(productId) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const newCart = cart.filter(item => item.productId !== productId);
            localStorage.setItem('cart', JSON.stringify(newCart));
            loadCart();
        }

        function checkout() {
            const selectedPayment = localStorage.getItem('selectedPaymentMethod');
            if (!selectedPayment) {
                // Si no hay método seleccionado, pedimos al usuario que lo elija
                const wantToChoose = confirm('No has seleccionado un método de pago. ¿Deseas elegir uno antes de continuar?');
                if (wantToChoose) {
                    // simplemente devolvemos para que el usuario pueda elegir
                    return;
                }
            }

            // Mostrar resumen de pago (incluyendo método si existe)
            const methodLabel = paymentOptions.find(p => p.id === selectedPayment)?.label || 'No especificado';
            alert(`¡Gracias por tu compra! Método de pago: ${methodLabel}\nProcesaremos tu pedido pronto.`);

            // Limpiar carrito (y opción de pago si quieres)
            localStorage.removeItem('cart');
            // localStorage.removeItem('selectedPaymentMethod'); // opcional: comentar si quieres mantener selección
            window.location.href = 'index.html';
        }

        // Inicialización al cargar la página
        loadCart();

        // Observador para actualizar selección visual si el usuario cambia en otra pestaña
        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedPaymentMethod') renderPaymentOptions();
            if (e.key === 'cart') loadCart();
        });
    </script>
</body>
</html>
